[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quechuatok"
version = "0.1.0"
description = "Morphological PRPE tokenizer for Southern Quechua"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maria Contreras", email = "mcontrerasmalpar@gmail.com" }]
requires-python = ">=3.10"
keywords = ["quechua", "tokenizer", "nlp", "morphology", "low-resource"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/mcontrerasmalpar-pixel/QuechuaTok"
Paper = "https://arxiv.org/abs/2606.23943"

[tool.setuptools.packages.find]
include = ["quechuatok*"]

[tool.setuptools.package-data]
quechuatok = ["prpe_suffixes.json"]
